<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WLO Agent Host</title>
<style>
body { background: #111; color: #eee; font-family: sans-serif; margin: 0; overflow: hidden; }
#status { position: absolute; top: 10px; left: 10px; padding: 8px 12px; background: rgba(0,0,0,0.7); border-radius: 4px; }
</style>
</head>
<body>
<div id="status">Loading assets...</div>
<script src="wasm_exec.js"></script>
<script>
(async () => {
  const status = document.getElementById('status');

  // Load only the companions selected by the core bundle's manifest.
  const listResp = await fetch('/packs.json');
  if (!listResp.ok) throw new Error('Asset manifest unavailable');
  const names = await listResp.json();

  // Only retain pack lengths. The Go reader requests bounded chunks on demand;
  // materializing all multi-gigabyte packs as Blobs can exhaust Chromium's quota.
  const packs = {};
  for (const name of names) {
    status.textContent = 'Checking ' + name + '...';
    const resp = await fetch('/assets/' + name, { method: 'HEAD' });
    const size = Number(resp.headers.get('Content-Length'));
    if (!resp.ok || !Number.isSafeInteger(size) || size <= 0) {
      throw new Error('Invalid asset pack ' + name);
    }
    packs[name] = { size };
  }

  window.wloPacks = packs;
  window.wloReadBlob = async (name, offset, length) => {
    const pack = packs[name];
    if (!pack || !Number.isSafeInteger(offset) || !Number.isSafeInteger(length) ||
        offset < 0 || length < 0 || offset + length > pack.size) {
      throw new Error('Invalid asset range for ' + name);
    }
    if (length === 0) return new ArrayBuffer(0);
    const end = offset + length - 1;
    const resp = await fetch('/assets/' + name, {
      headers: { Range: 'bytes=' + offset + '-' + end }, cache: 'no-store'
    });
    if (resp.status !== 206 || resp.headers.get('Content-Range') !==
        'bytes ' + offset + '-' + end + '/' + pack.size) {
      throw new Error('Asset server did not honor the requested range for ' + name);
    }
    const bytes = await resp.arrayBuffer();
    if (bytes.byteLength !== length) throw new Error('Truncated asset range for ' + name);
    return bytes;
  };

  status.textContent = 'Starting client...';
  const go = new Go();
  const resp = await fetch('wonderland-client.wasm');
  const bytes = await resp.arrayBuffer();
  const result = await WebAssembly.instantiate(bytes, go.importObject);
  go.run(result.instance);
})().catch(error => { document.getElementById('status').textContent = error.message; console.error(error); });
</script>
</body>
</html>
